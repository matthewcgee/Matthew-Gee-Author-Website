name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build BedSpace
        working-directory: bedspace-app
        run: |
          npm ci
          npm run build
      - name: Build Volleyball Stat Tracker
        working-directory: volleyball-app
        run: |
          npm ci
          npm run build
      - name: Build Piedmont Volleyball Stat Tracker
        working-directory: piedmont-volleyball-app
        run: |
          npm ci
          npm run build
      # Acuitas is built WITHOUT VITE_FIREBASE_CONFIG on purpose. With no config
      # the app runs entirely in the visitor's browser: no database connection,
      # no credentials in the bundle, and no way for a visitor to reach anyone
      # else's data. Do not add that variable to this public workflow — supply
      # it only in an internal deployment.
      - name: Build Acuitas
        working-directory: acuity-app
        run: |
          npm ci
          npm run build
      - name: Verify the published builds
        run: |
          if grep -rioE "atrium|wake ?forest|wakehealth|AIzaSy[0-9A-Za-z_-]{10}|firebaseapp\.com" acuity/ ; then
            echo "::error::Identifying strings or credentials found in the Acuitas build — refusing to publish."
            exit 1
          fi
          # This site is served from a custom domain at its root (see /CNAME), so
          # any asset pointing at /Matthew-Gee-Author-Website/ 404s and the page
          # renders blank. That bug has bitten three apps in this repo; fail
          # loudly on it for every one of them.
          for app in acuity bedspace volleyball piedmont-volleyball ; do
            if [ -f "$app/index.html" ] && grep -ioF "Matthew-Gee-Author-Website" "$app/index.html" ; then
              echo "::error::$app/index.html references the project path instead of the custom-domain root — its assets would 404."
              exit 1
            fi
          done
          echo "All builds are clean."
      - name: Remove build-time dependencies from artifact
        run: rm -rf bedspace-app/node_modules volleyball-app/node_modules piedmont-volleyball-app/node_modules acuity-app/node_modules
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
