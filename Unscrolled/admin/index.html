<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Prayer wall moderation — Unscrolled</title>
<link rel="icon" href="../../images/unscrolled-mark.svg" type="image/svg+xml">
<style>
:root{--night:#0b0b0f;--night2:#15151b;--snow:#f4f2ec;--soft:#a3a3ad;--gold:#d9ae5c;--line:rgba(244,242,236,.14);--red:#e0705f;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--night);color:var(--snow);font:500 16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
main{max-width:680px;margin:0 auto}
h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--soft);font-size:.9rem;margin:4px 0 20px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;font-size:.85rem;color:var(--soft)}
button{font:700 .85rem/1 inherit;font-family:inherit;border-radius:999px;padding:11px 18px;border:1.5px solid var(--line);background:transparent;color:var(--snow);cursor:pointer}
button:disabled{opacity:.5}
.primary{background:var(--gold);border-color:var(--gold);color:var(--night)}
.danger{border-color:var(--red);color:var(--red)}
.danger.sure{background:var(--red);color:var(--night)}
.req{background:var(--night2);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px}
.req.hidden-req{opacity:.6}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--soft)}
.meta b{color:var(--gold)}
.req p{margin:8px 0 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-right:auto}
.tag.live{color:var(--gold)} .tag.off{color:var(--soft)}
#msg{margin:16px 0;color:var(--soft)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Prayer wall moderation</h1>
  <p class="sub">Unscrolled &middot; private page</p>

  <div id="signedOut">
    <button class="primary" id="signIn" type="button">Sign in with Google</button>
  </div>

  <div id="signedIn" hidden>
    <div class="bar"><span id="who"></span><span><button id="refresh" type="button">Refresh</button> <button id="signOut" type="button">Sign out</button></span></div>
    <div id="list"></div>
  </div>
  <p id="msg" role="status">Loading&hellip;</p>
</main>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script>
// Public config; only the admin account named in the Firestore security rules can read or change anything here.
var firebaseConfig={apiKey:"AIzaSyA6i9KZFQUt9dWNv0rAE7FnrvHRP2vrVpc",authDomain:"unscrolled-ea2a2.firebaseapp.com",projectId:"unscrolled-ea2a2",storageBucket:"unscrolled-ea2a2.firebasestorage.app",messagingSenderId:"529772321422",appId:"1:529772321422:web:6b8809a891aa09f88cc7df"};
var msg=document.getElementById('msg'),list=document.getElementById('list');
function $(id){return document.getElementById(id)}

if(!window.firebase){msg.textContent='Could not load. Check your connection and refresh.'}
else{
  firebase.initializeApp(firebaseConfig);
  var auth=firebase.auth(),db=firebase.firestore();

  $('signIn').addEventListener('click',function(){
    msg.textContent='';
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e){msg.textContent='Sign-in did not complete ('+(e.code||'error')+').'});
  });
  $('signOut').addEventListener('click',function(){auth.signOut()});
  $('refresh').addEventListener('click',load);

  auth.onAuthStateChanged(function(user){
    $('signedOut').hidden=!!user;$('signedIn').hidden=!user;list.textContent='';
    if(!user){msg.textContent='Sign in to review prayer requests.';return}
    $('who').textContent='Signed in as '+(user.email||'');
    load();
  });

  function row(doc){
    var d=doc.data(),el=document.createElement('div');el.className='req'+(d.approved?'':' hidden-req');
    var meta=document.createElement('div');meta.className='meta';
    var b=document.createElement('b');b.textContent=d.name||'Anonymous';
    var t=document.createElement('span');t.textContent=(d.ts&&d.ts.toDate?d.ts.toDate().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'')+' · '+(d.praying||0)+' praying';
    meta.append(b,t);
    var p=document.createElement('p');p.textContent=d.text||'';
    var acts=document.createElement('div');acts.className='acts';
    var tag=document.createElement('span');tag.className='tag '+(d.approved?'live':'off');tag.textContent=d.approved?'On the wall':'Hidden';
    var toggle=document.createElement('button');toggle.type='button';toggle.textContent=d.approved?'Hide':'Show on wall';if(!d.approved)toggle.className='primary';
    toggle.addEventListener('click',function(){
      toggle.disabled=true;
      doc.ref.update({approved:!d.approved}).then(load).catch(function(){toggle.disabled=false;msg.textContent='That change did not save.'});
    });
    var del=document.createElement('button');del.type='button';del.className='danger';del.textContent='Delete';
    del.addEventListener('click',function(){
      if(!del.classList.contains('sure')){del.classList.add('sure');del.textContent='Tap again to delete';setTimeout(function(){del.classList.remove('sure');del.textContent='Delete'},4000);return}
      del.disabled=true;
      doc.ref.delete().then(load).catch(function(){del.disabled=false;msg.textContent='That delete did not go through.'});
    });
    acts.append(tag,toggle,del);el.append(meta,p,acts);return el;
  }

  function load(){
    msg.textContent='Loading…';
    db.collection('prayers').orderBy('ts','desc').limit(300).get().then(function(snap){
      list.textContent='';
      snap.forEach(function(doc){list.append(row(doc))});
      msg.textContent=snap.size?snap.size+' request'+(snap.size===1?'':'s')+', newest first.':'No prayer requests yet.';
    }).catch(function(){
      list.textContent='';
      msg.textContent='This Google account does not have access to moderate the prayer wall. Sign out and use the admin account.';
    });
  }
}
</script>
</body>
</html>
