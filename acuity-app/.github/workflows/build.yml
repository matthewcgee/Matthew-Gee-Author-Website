# Acuitas — test and build on every push.
#
# This file does nothing while Acuitas lives inside the author website
# repository (GitHub only runs workflows from a repository's root). Once the
# app is moved to its own repository (HANDOFF.md → "Moving Acuitas to your
# internal GitHub"), it runs automatically.
#
# Optional secret ACUITAS_ENV: the full contents of your .env.production
# (see .env.example). Without it the build is the self-contained local-mode copy.
#
# On GitHub Enterprise Server, if actions/upload-artifact@v4 is not available,
# change it to actions/upload-artifact@v3.

name: Build Acuitas

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run the test suite
        run: npm test

      - name: Write build settings
        env:
          ACUITAS_ENV: ${{ secrets.ACUITAS_ENV }}
        run: |
          # Defaults for a standalone repository; anything in the secret wins.
          printf 'ACUITAS_BASE=/\nACUITAS_OUT_DIR=dist\n' > .env.production
          if [ -n "$ACUITAS_ENV" ]; then printf '%s\n' "$ACUITAS_ENV" >> .env.production; fi
          printf 'ACUITAS_OUT_DIR=dist\n' >> .env.production

      - run: npm run build

      - name: Remove build settings
        if: always()
        run: rm -f .env.production

      - uses: actions/upload-artifact@v4
        with:
          name: acuitas-site
          path: dist
          retention-days: 30

  # The data service's behavior suite against real databases: Microsoft SQL
  # Server 2022 and PostgreSQL 16, each a fresh empty database per run.
  data-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: acuitas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Ci-only!Passw0rd'
          MSSQL_PID: Developer
        ports: ['1433:1433']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: api
      - name: Create the SQL Server test database
        run: |
          for i in $(seq 1 30); do
            docker exec "${{ job.services.mssql.id }}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci-only!Passw0rd' -C -Q "CREATE DATABASE acuitas_test" && break
            sleep 3
          done
      - name: Run the data service suite on SQL Server and PostgreSQL
        env:
          ACUITAS_TEST_PG: postgresql://postgres:ci-only-password@localhost:5432/acuitas_test
          ACUITAS_TEST_MSSQL: Server=localhost,1433;Database=acuitas_test;User Id=sa;Password=Ci-only!Passw0rd;Encrypt=true;TrustServerCertificate=true
        run: npx vitest run api
